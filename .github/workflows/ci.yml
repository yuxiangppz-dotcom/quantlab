name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked default environment
        run: uv sync --frozen

      - name: Unit and integration tests
        run: uv run pytest -q

      - name: Ruff
        run: uv run ruff check .

      - name: Diff whitespace check
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF}" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  research-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GNU OpenMP runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked research runtimes
        run: uv sync --frozen --extra research --extra qlib

      - name: Exercise Qlib and LightGBM adapters
        env:
          QUANTLAB_TEST_OPTIONAL_RESEARCH: "1"
        run: uv run pytest -q tests/research/test_optional_runtime.py tests/research/test_ml_v2.py tests/research/test_ml_operations.py tests/research/test_ml_reliability.py tests/research/test_ml_service.py
