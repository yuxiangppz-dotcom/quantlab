name: Scout CI

on:
  push:
    branches: [master, "feat/shortline-research-assistant"]
  pull_request:
    branches: [master, "feat/shortline-research-assistant"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked default environment
        run: uv sync --frozen

      - name: Unit and integration tests
        run: uv run pytest -q

      - name: Offline CLI smoke checks
        run: |
          uv run scout --doctor
          uv run scout --demo

      - name: Ruff
        run: uv run ruff check .

      - name: Diff whitespace check
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF}" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
