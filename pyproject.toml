[project]
name = "quantlab-scout"
version = "0.1.0"
description = "Independent multi-source A-share AI research assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tushare>=1.4.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "jsonschema>=4.20,<5",
]

[project.scripts]
scout = "quantlab.scout.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quantlab"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[[tool.uv.index]]
url = "https://uv.agentsmirror.com/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]
