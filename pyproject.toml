[project]
name = "quantlab"
version = "1.1.0"
description = "A-share quantitative research toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tushare>=1.4.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.40,<2",
]

[project.scripts]
quantlab = "quantlab.__main__:main"

[project.optional-dependencies]
research = [
    "lightgbm>=4.5,<5",
]
qlib = [
    "pyqlib>=0.9.7,<0.10",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[[tool.uv.index]]
url = "https://uv.agentsmirror.com/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]
